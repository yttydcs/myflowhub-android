name: ci

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android
        uses: actions/checkout@v4
        with:
          path: repo/MyFlowHub-Android

      - name: Resolve hubmobile dependency refs
        id: deps
        shell: bash
        working-directory: repo/MyFlowHub-Android
        run: |
          set -euo pipefail
          hub_go_mod="hubmobile/go.mod"
          resolve_ref() {
            local module="$1"
            local version
            version="$(awk -v module="${module}" '
              $1 == "require" && $2 == module { print $3; exit }
              $1 == module { print $2; exit }
            ' "${hub_go_mod}")"
            if [[ -z "${version}" ]]; then
              echo "无法从 ${hub_go_mod} 解析 ${module} 版本" >&2
              exit 1
            fi
            printf '%s' "${version}"
          }
          server_ref="$(resolve_ref 'github.com/yttydcs/myflowhub-server')"
          sdk_ref="$(resolve_ref 'github.com/yttydcs/myflowhub-sdk')"
          proto_ref="$(resolve_ref 'github.com/yttydcs/myflowhub-proto')"
          echo "server_ref=${server_ref}" >> "$GITHUB_OUTPUT"
          echo "sdk_ref=${sdk_ref}" >> "$GITHUB_OUTPUT"
          echo "proto_ref=${proto_ref}" >> "$GITHUB_OUTPUT"
          {
            echo "Resolved hubmobile dependency refs:"
            echo "- Server: ${server_ref}"
            echo "- SDK: ${sdk_ref}"
            echo "- Proto: ${proto_ref}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Server (for hubmobile replace)
        uses: actions/checkout@v4
        with:
          repository: yttydcs/myflowhub-server
          ref: ${{ steps.deps.outputs.server_ref }}
          path: repo/MyFlowHub-Server

      - name: Checkout SDK (for hubmobile replace)
        uses: actions/checkout@v4
        with:
          repository: yttydcs/myflowhub-sdk
          ref: ${{ steps.deps.outputs.sdk_ref }}
          path: repo/MyFlowHub-SDK

      - name: Checkout Proto (for hubmobile replace)
        uses: actions/checkout@v4
        with:
          repository: yttydcs/myflowhub-proto
          ref: ${{ steps.deps.outputs.proto_ref }}
          path: repo/MyFlowHub-Proto

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-26" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Install gomobile (pinned by hubmobile/go.mod)
        shell: bash
        working-directory: repo/MyFlowHub-Android/hubmobile
        run: |
          set -euo pipefail
          mobile_version="$(GOWORK=off go list -m -f '{{.Version}}' golang.org/x/mobile)"
          if [[ -z "${mobile_version}" || "${mobile_version}" == "(devel)" ]]; then
            echo "无法从 hubmobile/go.mod 解析 golang.org/x/mobile 版本" >&2
            exit 1
          fi
          go install "golang.org/x/mobile/cmd/gomobile@${mobile_version}"
          go install "golang.org/x/mobile/cmd/gobind@${mobile_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile version || true

      - name: Build AAR (gomobile)
        shell: bash
        run: |
          set -euo pipefail
          bash repo/MyFlowHub-Android/scripts/build_aar.sh 2>&1 | tee gomobile-build.log

      - name: Upload gomobile log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: myflowhub-android-gomobile-log
          if-no-files-found: ignore
          path: gomobile-build.log

      - name: Assemble debug APK
        working-directory: repo/MyFlowHub-Android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee gradle-debug.log

      - name: Upload Gradle log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: myflowhub-android-debug-log
          if-no-files-found: ignore
          path: |
            repo/MyFlowHub-Android/gradle-debug.log

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: myflowhub-android-debug
          if-no-files-found: error
          path: |
            repo/MyFlowHub-Android/app/build/outputs/apk/debug/app-debug.apk
            repo/MyFlowHub-Android/app/libs/myflowhub.aar

  publish-debug-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: myflowhub-android-debug-latest
      cancel-in-progress: true
    steps:
      - name: Download artifacts (debug)
        uses: actions/download-artifact@v4
        with:
          name: myflowhub-android-debug
          path: artifacts

      - name: Publish debug-latest release (APK + AAR)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          tag="debug-latest"
          sha="${GITHUB_SHA}"

          if [[ ! -d "artifacts" ]]; then
            echo "找不到 artifacts 目录（download-artifact 可能失败）" >&2
            exit 1
          fi

          mapfile -t apk_candidates < <(find artifacts -type f -name 'app-debug.apk' -print)
          filtered_apk_candidates=()
          for p in "${apk_candidates[@]}"; do
            if [[ "${p}" == */build/outputs/apk/debug/app-debug.apk ]]; then
              filtered_apk_candidates+=("${p}")
            fi
          done
          apk_candidates=("${filtered_apk_candidates[@]}")
          if (( ${#apk_candidates[@]} != 1 )); then
            echo "期望找到 1 个 Debug APK（*/build/outputs/apk/debug/app-debug.apk），但找到 ${#apk_candidates[@]} 个" >&2
            if (( ${#apk_candidates[@]} > 0 )); then
              printf '  - %s\n' "${apk_candidates[@]}" >&2
            fi
            echo "artifacts 目录结构：" >&2
            ls -R artifacts >&2
            exit 1
          fi
          apk_path="${apk_candidates[0]}"

          mapfile -t aar_candidates < <(find artifacts -type f -name 'myflowhub.aar' -print)
          filtered_aar_candidates=()
          for p in "${aar_candidates[@]}"; do
            if [[ "${p}" == */libs/myflowhub.aar ]]; then
              filtered_aar_candidates+=("${p}")
            fi
          done
          aar_candidates=("${filtered_aar_candidates[@]}")
          if (( ${#aar_candidates[@]} != 1 )); then
            echo "期望找到 1 个 AAR（*/libs/myflowhub.aar），但找到 ${#aar_candidates[@]} 个" >&2
            if (( ${#aar_candidates[@]} > 0 )); then
              printf '  - %s\n' "${aar_candidates[@]}" >&2
            fi
            echo "artifacts 目录结构：" >&2
            ls -R artifacts >&2
            exit 1
          fi
          aar_path="${aar_candidates[0]}"

          # 让 debug-latest tag 永远指向最新 main commit（强制更新）
          api_base="https://api.github.com"
          auth_header="Authorization: token ${GH_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          ref_url="${api_base}/repos/${repo}/git/ref/tags/${tag}"
          ref_status="$(curl -sS -o /dev/null -w '%{http_code}' -H "${auth_header}" -H "${accept_header}" -H "${version_header}" "${ref_url}")"
          if [[ "${ref_status}" == "200" ]]; then
            curl -sSf -X PATCH \
              -H "${auth_header}" -H "${accept_header}" -H "${version_header}" \
              "${api_base}/repos/${repo}/git/refs/tags/${tag}" \
              -d "{\"sha\":\"${sha}\",\"force\":true}" \
              >/dev/null
          elif [[ "${ref_status}" == "404" ]]; then
            curl -sSf -X POST \
              -H "${auth_header}" -H "${accept_header}" -H "${version_header}" \
              "${api_base}/repos/${repo}/git/refs" \
              -d "{\"ref\":\"refs/tags/${tag}\",\"sha\":\"${sha}\"}" \
              >/dev/null
          else
            echo "检查 tag ref 失败：HTTP ${ref_status} (${ref_url})" >&2
            exit 1
          fi

          release_title="Debug (latest)"
          run_url="${GITHUB_SERVER_URL}/${repo}/actions/runs/${GITHUB_RUN_ID}"
          release_notes=$(printf "自动构建的 Debug 版本（main）\n\ncommit=%s\nrun=%s\n" "${sha}" "${run_url}")

          if gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release edit "${tag}" --repo "${repo}" --title "${release_title}" --notes "${release_notes}" --prerelease
          else
            gh release create "${tag}" --repo "${repo}" --title "${release_title}" --notes "${release_notes}" --prerelease
          fi

          gh release upload "${tag}" "${apk_path}" --repo "${repo}" --clobber
          gh release upload "${tag}" "${aar_path}" --repo "${repo}" --clobber

          apk_url="https://github.com/${repo}/releases/download/${tag}/app-debug.apk"
          aar_url="https://github.com/${repo}/releases/download/${tag}/myflowhub.aar"
          release_url="https://github.com/${repo}/releases/tag/${tag}"
          {
            echo "## Debug Assets"
            echo ""
            echo "- Release: ${release_url}"
            echo "- APK: ${apk_url}"
            echo "- AAR: ${aar_url}"
            echo "- Commit: \`${sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

