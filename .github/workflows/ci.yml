name: ci

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android
        uses: actions/checkout@v4
        with:
          path: repo/MyFlowHub-Android

      - name: Checkout Server (for hubmobile replace)
        uses: actions/checkout@v4
        with:
          repository: yttydcs/myflowhub-server
          path: repo/MyFlowHub-Server

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: repo/MyFlowHub-Android/hubmobile/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-26" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build AAR (gomobile)
        run: bash repo/MyFlowHub-Android/scripts/build_aar.sh

      - name: Assemble debug APK
        working-directory: repo/MyFlowHub-Android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee gradle-debug.log

      - name: Summarize Gradle failure
        if: failure()
        working-directory: repo/MyFlowHub-Android
        run: |
          set -euo pipefail
          if [[ ! -f gradle-debug.log ]]; then
            echo "::error::assembleDebug failed but gradle-debug.log not found"
            exit 0
          fi

          msg="$(
            awk '
              $0 ~ /^\\* What went wrong:/ { inSection=1; next }
              inSection && $0 ~ /^> / { sub(/^> /, \"\"); print; exit }
              inSection && $0 ~ /^\\* / { exit }
            ' gradle-debug.log | head -n 1
          )"
          if [[ -z "${msg}" ]]; then
            msg="$(tail -n 80 gradle-debug.log | tr -d '\r' | sed -e 's/[[:space:]]\\+/ /g' | tail -n 1)"
          fi
          msg="$(echo "${msg}" | tr -d '\r' | sed -e 's/[[:space:]]\\+/ /g' | cut -c1-800)"
          echo "::error::assembleDebug failed: ${msg}"

      - name: Upload Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myflowhub-android-debug-log
          if-no-files-found: error
          path: |
            repo/MyFlowHub-Android/gradle-debug.log

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: myflowhub-android-debug
          if-no-files-found: error
          path: |
            repo/MyFlowHub-Android/app/build/outputs/apk/debug/app-debug.apk
            repo/MyFlowHub-Android/app/libs/myflowhub.aar

