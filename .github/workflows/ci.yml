name: ci

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android
        uses: actions/checkout@v4
        with:
          path: repo/MyFlowHub-Android

      - name: Checkout Server (for hubmobile replace)
        uses: actions/checkout@v4
        with:
          repository: yttydcs/myflowhub-server
          path: repo/MyFlowHub-Server

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: repo/MyFlowHub-Android/hubmobile/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-26" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build AAR (gomobile)
        run: bash repo/MyFlowHub-Android/scripts/build_aar.sh

      - name: Assemble debug APK
        working-directory: repo/MyFlowHub-Android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee gradle-debug.log

      - name: Upload Gradle log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: myflowhub-android-debug-log
          if-no-files-found: error
          path: |
            repo/MyFlowHub-Android/gradle-debug.log

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: myflowhub-android-debug
          if-no-files-found: error
          path: |
            repo/MyFlowHub-Android/app/build/outputs/apk/debug/app-debug.apk
            repo/MyFlowHub-Android/app/libs/myflowhub.aar

  publish-debug-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: myflowhub-android-debug-latest
      cancel-in-progress: true
    steps:
      - name: Download artifacts (debug)
        uses: actions/download-artifact@v4
        with:
          name: myflowhub-android-debug
          path: artifacts

      - name: Publish debug-latest release (APK + AAR)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          tag="debug-latest"
          sha="${GITHUB_SHA}"

          if [[ ! -d "artifacts" ]]; then
            echo "找不到 artifacts 目录（download-artifact 可能失败）" >&2
            exit 1
          fi

          mapfile -t apk_candidates < <(find artifacts -type f -name 'app-debug.apk' -print)
          filtered_apk_candidates=()
          for p in "${apk_candidates[@]}"; do
            if [[ "${p}" == */build/outputs/apk/debug/app-debug.apk ]]; then
              filtered_apk_candidates+=("${p}")
            fi
          done
          apk_candidates=("${filtered_apk_candidates[@]}")
          if (( ${#apk_candidates[@]} != 1 )); then
            echo "期望找到 1 个 Debug APK（*/build/outputs/apk/debug/app-debug.apk），但找到 ${#apk_candidates[@]} 个" >&2
            if (( ${#apk_candidates[@]} > 0 )); then
              printf '  - %s\n' "${apk_candidates[@]}" >&2
            fi
            echo "artifacts 目录结构：" >&2
            ls -R artifacts >&2
            exit 1
          fi
          apk_path="${apk_candidates[0]}"

          mapfile -t aar_candidates < <(find artifacts -type f -name 'myflowhub.aar' -print)
          filtered_aar_candidates=()
          for p in "${aar_candidates[@]}"; do
            if [[ "${p}" == */libs/myflowhub.aar ]]; then
              filtered_aar_candidates+=("${p}")
            fi
          done
          aar_candidates=("${filtered_aar_candidates[@]}")
          if (( ${#aar_candidates[@]} != 1 )); then
            echo "期望找到 1 个 AAR（*/libs/myflowhub.aar），但找到 ${#aar_candidates[@]} 个" >&2
            if (( ${#aar_candidates[@]} > 0 )); then
              printf '  - %s\n' "${aar_candidates[@]}" >&2
            fi
            echo "artifacts 目录结构：" >&2
            ls -R artifacts >&2
            exit 1
          fi
          aar_path="${aar_candidates[0]}"

          # 让 debug-latest tag 永远指向最新 main commit（强制更新）
          if gh api "repos/${repo}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${repo}/git/refs/tags/${tag}" -f sha="${sha}" -f force=true >/dev/null
          else
            gh api --method POST "repos/${repo}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}" >/dev/null
          fi

          release_title="Debug (latest)"
          run_url="${GITHUB_SERVER_URL}/${repo}/actions/runs/${GITHUB_RUN_ID}"
          release_notes=$(printf "自动构建的 Debug 版本（main）\n\ncommit=%s\nrun=%s\n" "${sha}" "${run_url}")

          if gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release edit "${tag}" --repo "${repo}" --title "${release_title}" --notes "${release_notes}" --prerelease
          else
            gh release create "${tag}" --repo "${repo}" --title "${release_title}" --notes "${release_notes}" --prerelease
          fi

          gh release upload "${tag}" "${apk_path}" --repo "${repo}" --clobber
          gh release upload "${tag}" "${aar_path}" --repo "${repo}" --clobber

          apk_url="https://github.com/${repo}/releases/download/${tag}/app-debug.apk"
          aar_url="https://github.com/${repo}/releases/download/${tag}/myflowhub.aar"
          release_url="https://github.com/${repo}/releases/tag/${tag}"
          {
            echo "## Debug Assets"
            echo ""
            echo "- Release: ${release_url}"
            echo "- APK: ${apk_url}"
            echo "- AAR: ${aar_url}"
            echo "- Commit: \`${sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

