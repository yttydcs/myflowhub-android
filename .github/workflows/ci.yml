name: ci

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android
        uses: actions/checkout@v4
        with:
          path: repo/MyFlowHub-Android

      - name: Checkout Server (for hubmobile replace)
        uses: actions/checkout@v4
        with:
          repository: yttydcs/myflowhub-server
          path: repo/MyFlowHub-Server

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: repo/MyFlowHub-Android/hubmobile/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-26" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build AAR (gomobile)
        run: bash repo/MyFlowHub-Android/scripts/build_aar.sh

      - name: Assemble debug APK
        working-directory: repo/MyFlowHub-Android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: myflowhub-android-debug
          if-no-files-found: error
          path: |
            repo/MyFlowHub-Android/app/build/outputs/apk/debug/app-debug.apk
            repo/MyFlowHub-Android/app/libs/myflowhub.aar

